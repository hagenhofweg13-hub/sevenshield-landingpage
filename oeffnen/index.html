<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>SevenShield Nachricht öffnen</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #1A1D1F; --void: #101214; --surface: #21252A; --surface-2: #262B31;
    --line: #2E3338; --accent: #2ECC71; --accent-deep: #16A34A;
    --text: #EDEFF1; --text-muted: #8B9198; --danger: #F0776B; --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.55; min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  header { background: var(--void); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 600; font-size: 18px; }
  .brand svg { width: 34px; height: 34px; }
  .lang { font-size: 14px; color: var(--text-muted); }
  .lang button { background: none; border: 0; color: var(--text-muted); font: inherit; padding: 6px 4px; cursor: pointer; }
  .lang button[aria-current="true"] { color: var(--accent); font-weight: 600; }
  main { padding: 28px 0 40px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 10px; }
  .lead { color: var(--text-muted); margin: 0 0 22px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
  label.caption, .caption { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 6px; }
  .drop {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border: 1px dashed #3a4047; border-radius: var(--radius); padding: 14px; background: var(--surface-2);
  }
  .drop.over { border-color: var(--accent); }
  .drop .fname { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; color: var(--text-muted); font-size: 15px; }
  .drop .fname.set { color: var(--text); }
  .row { display: flex; gap: 8px; }
  input[type=password], input[type=text] {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text); background: var(--void);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn {
    font: inherit; font-weight: 600; border-radius: 8px; border: 1px solid var(--line); cursor: pointer;
    background: var(--surface-2); color: var(--text); padding: 12px 16px; min-height: 46px;
  }
  .btn-primary { background: var(--accent); color: #07240f; border-color: var(--accent); width: 100%; margin-top: 16px; }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .btn-small { padding: 8px 12px; min-height: 40px; }
  .status { margin-top: 14px; font-size: 15px; min-height: 22px; }
  .status.err { color: var(--danger); }
  .status.busy { color: var(--text-muted); }
  .msg { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; }
  .att { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .att:first-of-type { border-top: 0; }
  .att span.n { overflow-wrap: anywhere; min-width: 0; }
  .att small { color: var(--text-muted); display: block; }
  .hidden { display: none !important; }
  .note { color: var(--text-muted); font-size: 14px; margin-top: 22px; }
  .note a { color: var(--accent); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
</style>
</head>

      <button type="button" data-lang="fr">FR</button> /
      <button type="button" data-lang="it">IT</button>
    </div>
  </div>
</header>

<main>
<div class="wrap">
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>

  <section id="formView" class="card">
    <span class="caption" data-t="fileCaption"></span>
    <div class="drop" id="drop">
      <button type="button" class="btn btn-small" id="pick" data-t="pick"></button>
      <span class="fname" id="fname"></span>
      <input type="file" id="file" class="hidden">
    </div>

    <label class="caption" for="pw" style="margin-top:16px" data-t="pwCaption"></label>
    <div class="row">
      <input type="password" id="pw" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="button" class="btn btn-small" id="show" data-t="show"></button>
    </div>

    <button type="button" class="btn btn-primary" id="open" data-t="open" disabled></button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <section id="resultView" class="hidden">
    <div class="card">
      <span class="caption" data-t="msgCaption"></span>
      <div class="msg" id="msgText"></div>
    </div>
    <div class="card hidden" id="attCard">
      <span class="caption" data-t="attCaption"></span>
      <div id="attList"></div>
      <p class="note hidden" id="saveHint"></p>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="close" data-t="close"></button>
    </div>
  </section>

  <p class="note"><span data-t="privacy"></span> <a href="../" data-t="more"></a></p>
</div>
</main>

<script>
// SevenShield Nachricht oeffnen: Kern. Liest 7SV1-Container (Nachrichten) im Browser.
// Abhaengigkeiten: crypto.subtle, DecompressionStream, argon2id (hash-wasm).
var SevenCore = (function () {
  'use strict';

  var CHUNK = 4 * 1024 * 1024;
  var MAX_TEXT = 1024 * 1024;
  var MAX_ATT = 25 * 1024 * 1024;
  var MAX_COUNT = 20;
  var MAX_FILE = MAX_TEXT + MAX_ATT + 256 * 1024;
  var NAME_TXT = 'SevenShield:Nachricht.txt';
  var NAME_ZIP = 'SevenShield:Nachricht.zip';

  function CoreError(code) { this.code = code; this.message = code; }
  CoreError.prototype = Object.create(Error.prototype);

  var utf8 = new TextEncoder();
  function utf8Lenient(bytes) { return new TextDecoder('utf-8', { fatal: false }).decode(bytes); }

  function ascii(u8, off, s) {
    for (var i = 0; i < s.length; i++) if (u8[off + i] !== s.charCodeAt(i)) return false;
    return true;
  }
  function b64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function toB64(u8) {
    var s = '';
    for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return btoa(s);
  }
  function concat(a, b) {
    var o = new Uint8Array(a.length + b.length);
    o.set(a, 0); o.set(b, a.length);
    return o;
  }

  async function gcm(keyBytes, nonce, cipher, tag, aad) {
    var key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
    var params = { name: 'AES-GCM', iv: nonce, tagLength: 128 };
    if (aad && aad.length) params.additionalData = aad;
    return new Uint8Array(await crypto.subtle.decrypt(params, key, concat(cipher, tag)));
  }

  function chunkAad(index, isFinal) {
    var aad = new Uint8Array(9);
    var dv = new DataView(aad.buffer);
    dv.setUint32(0, index >>> 0, true);
    dv.setUint32(4, Math.floor(index / 4294967296), true);
    aad[8] = isFinal ? 1 : 0;
    return aad;
  }

  // Liefert { name, content } oder wirft CoreError('format' | 'password' | 'damaged' | 'toobig')
  async function decryptContainer(data, password, argon2id) {
    var len = data.length;
    if (len < 65 + 8 + 1 || !ascii(data, 0, '7SV1')) throw new CoreError('format');
    if (len > MAX_FILE * 2) throw new CoreError('toobig');
    if (!ascii(data, len - 4, '7SVM')) throw new CoreError('format');

    var dv = new DataView(data.buffer, data.byteOffset, data.byteLength);
    var jsonLen = dv.getInt32(len - 8, true);
    if (jsonLen <= 0 || jsonLen > 65536) throw new CoreError('format');
    var dataEnd = len - 8 - jsonLen;
    if (dataEnd < 65) throw new CoreError('format');

    var version = data[4];
    if (version !== 2 && version !== 3) throw new CoreError('format');

    var info;
    try { info = JSON.parse(new TextDecoder().decode(data.subarray(dataEnd, dataEnd + jsonLen))); }
    catch (e) { throw new CoreError('damaged'); }
    if (!info || (info.FormatVersion | 0) < 2) throw new CoreError('format');

    // Schluessel des Containers: Passwort -> Wrap -> Master-Key
    var pwKey, masterKey;
    try {
      pwKey = await argon2id({
        password: utf8.encode(password),
        salt: b64(info.PasswordSaltBase64),
        parallelism: info.Argon2Parallelism,
        iterations: info.Argon2Iterations,
        memorySize: info.Argon2MemorySizeKb,
        hashLength: info.Argon2KeyLengthBytes,
        outputType: 'binary'
      });
    } catch (e) { throw new CoreError('damaged'); }
    try {
      masterKey = await gcm(pwKey, b64(info.PasswordWrapNonceBase64),
        b64(info.PasswordWrappedKeyBase64), b64(info.PasswordWrapTagBase64));
    } catch (e) { throw new CoreError('password'); }
    pwKey.fill(0);

    // Inhaltsschluessel: Der Master-Key dient (als Base64-Text) als Passwort des Containers
    var salt = data.subarray(5, 21);
    var mem = dv.getInt32(21, true), it = dv.getInt32(25, true), par = dv.getInt32(29, true);
    var nameNonce = data.subarray(33, 45), nameTag = data.subarray(45, 61);
    var nameLen = dv.getInt32(61, true);

    var pos = 65 + nameLen;

    var key = await argon2id({
      password: utf8.encode(toB64(masterKey)),
      salt: salt, parallelism: par, iterations: it, memorySize: mem,
      hashLength: 32, outputType: 'binary'

    try {
      var name;
      try { name = new TextDecoder().decode(await gcm(key, nameNonce, encName, nameTag)); }
      catch (e) { throw new CoreError('damaged'); }

    if (name.length > 150) name = name.substring(0, 150);
    var dot = name.lastIndexOf('.');
    var stem = dot > 0 ? name.substring(0, dot) : name;
    var ext = dot > 0 ? name.substring(dot) : '';

    while (used[cand.toLowerCase()]) { cand = stem + ' (' + n + ')' + ext; n++; }
    used[cand.toLowerCase()] = true;
    return cand;
  }

    }

    var count = dv.getUint16(eocd + 10, true);
    var p = dv.getUint32(eocd + 16, true);
    if (count > MAX_COUNT + 2) throw new CoreError('damaged');

    var text = null, atts = [], used = {}, budget = MAX_ATT;
    for (var e = 0; e < count; e++) {
      if (p + 46 > z.length || dv.getUint32(p, true) !== 0x02014b50) throw new CoreError('damaged');

  }
